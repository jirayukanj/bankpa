<!DOCTYPE html>
<html>
<head>
    <title>Edit Movie</title>
    <style>
        /* ใช้ Style เดียวกับ append.html */
        body { font-family: 'Segoe UI', sans-serif; background: #141414; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #2f2f2f; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; }
        h2 { color: #E50914; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; background: #444; border: 1px solid #555; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #E50914; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>แก้ไขข้อมูลหนัง</h2>
    <form method="POST">
        <div class="form-group">
            <label>🎬 ชื่อภาพยนตร์</label>
            <input name="title" value="{{ movie.title }}" required>
        </div>
        <div class="form-group">
            <label>💰 ราคา</label>
            <input name="price" type="number" step="0.01" value="{{ movie.price }}" required>
        </div>
        <div class="form-group">
            <label>🖼️ URL รูปโปสเตอร์</label>
            <input name="poster" value="{{ movie.poster }}">
        </div>
        <div class="form-group">
            <label>📦 จำนวนในคลัง</label>
            <input name="stock" type="number" value="{{ movie.stock }}">
        </div>
        <div class="form-group">
            <label>🏷️ แนวหนัง</label>
            <select name="genre_id">
                {% for genre in genres %}
                <option value="{{ genre.id }}" {% if genre.id == movie.genre_id %}selected{% endif %}>
                    {{ genre.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">💾 อัปเดตข้อมูล</button>
    </form>
    <a href="/" class="back-link">⬅️ ยกเลิก</a>
</div>

</body>
</html>
