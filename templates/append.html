<!DOCTYPE html>
<html>
<head>
    <title>Add Movie</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #141414;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #2f2f2f;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #E50914; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #444;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #E50914;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>เพิ่มหนังใหม่</h2>
    <form method="POST">
        <div class="form-group">
            <label>🎬 ชื่อภาพยนตร์</label>
            <input name="title" placeholder="ระบุชื่อหนัง" required>
        </div>
        <div class="form-group">
            <label>💰 ราคา (บาท)</label>
            <input name="price" type="number" step="0.01" required>
        </div>
        <div class="form-group">
            <label>🖼️ URL รูปโปสเตอร์</label>
            <input name="poster" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>📦 จำนวนในคลัง</label>
            <input name="stock" type="number" value="0">
        </div>
        <div class="form-group">
            <label>🏷️ แนวหนัง</label>
            <select name="genre_id">
                {% for genre in genres %}
                <option value="{{ genre.id }}">{{ genre.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">✅ บันทึกข้อมูล</button>
    </form>
    <a href="/" class="back-link">⬅️ กลับหน้าหลัก</a>
</div>

</body>
</html>
