<!DOCTYPE html>
<html>
<head>
    <title>Movie Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #141414; /* พื้นหลังสีดำแบบ Netflix */
            color: white;
            margin: 0;
            min-height: 100vh;
        }

        header {
            background: #000;
            padding: 30px 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #E50914; /* สีแดงหลัก */
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .btn {
            padding: 12px 25px;
            background: #E50914;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
            margin-bottom: 30px;
        }

        .btn:hover { background: #b20710; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: #2f2f2f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: scale(1.05); }

        .card img {
            width: 100%;
            height: 320px; /* ปรับเป็นทรงสูงสำหรับโปสเตอร์หนัง */
            object-fit: cover;
        }

        .card-info { padding: 15px; }
        
        h3 { margin: 0 0 10px 0; font-size: 18px; }

        .hashtag {
            background: #464646;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        .actions a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            color: #aaa;
        }
        .actions a:hover { color: white; }
    </style>
</head>
<body>

<header>MOVIE STORE 🎬</header>

<div class="container">
    <a href="/append" class="btn">➕ Add New Movie</a>

    {% if movies %}
    <div class="grid">
        {% for movie in movies %}
        <div class="card">
            <img src="{{ movie.poster }}" alt="{{ movie.title }}">
            <div class="card-info">
                <h3>{{ movie.title }}</h3>
                <span class="hashtag">#{{ movie.genre_name }}</span>
                <p style="color: #46d369; margin: 10px 0;">ราคา: <strong>{{ movie.price }} บาท</strong></p>
                <p style="font-size: 13px; color: #999;">คลัง: {{ movie.stock }} รายการ</p>
                
                <div class="actions">
                    <a href="/edit/{{ movie.id }}">✏️ แก้ไข</a>
                    <a href="/delete/{{ movie.id }}" style="color: #ff4d4d;">🗑️ ลบ</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div style="text-align: center; padding: 50px;">ยังไม่มีภาพยนตร์ในระบบ</div>
    {% endif %}
</div>

</body>
</html>
